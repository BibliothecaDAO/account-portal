name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      VITE_PUBLIC_CHAIN: mainnet
      VITE_PUBLIC_SLOT: ci
      VITE_BASE_URL: https://ci.realms.world
      VITE_TORII_API_URL: https://torii.example.test
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      ALCHEMY_API_KEY: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm -r --filter '!@realms-world/apibara' --if-present run format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production artifact smoke test
        run: pnpm smoke
