name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (exclude apibara)
        run: pnpm -r --filter '!@realms-world/apibara' --if-present run lint

      - name: Format check (exclude apibara)
        run: pnpm -r --filter '!@realms-world/apibara' --if-present run format

      - name: Typecheck constants
        run: pnpm --filter @realms-world/constants typecheck

      - name: Build db
        run: pnpm --filter @realms-world/db build

      - name: Build account-portal
        run: pnpm --filter @realms-world/account-portal exec vite build
        env:
          CI: "true"
